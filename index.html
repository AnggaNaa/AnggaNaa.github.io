<style>

html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}

/* ---------- fixed left frame ---------- */
.leftbg{position:fixed;top:0;left:0;bottom:0;width:50%;background:var(--paper);z-index:1}
.top{position:fixed;top:0;left:0;width:50%;z-index:6;padding:calc(48px + env(safe-area-inset-top,0px)) var(--pad) 0;pointer-events:none}
.logo{pointer-events:auto;display:inline-flex;font-family:var(--serif);font-weight:600;font-size:42px;line-height:1;letter-spacing:-.02em;text-decoration:none}
.logo i{font-style:normal;display:inline-block;transform:scaleX(1.25);transform-origin:left;margin-right:.18em}
.bar{position:fixed;left:0;bottom:0;width:50%;height:calc(var(--bar) + env(safe-area-inset-bottom,0px));padding:0 var(--pad) env(safe-area-inset-bottom,0px);background:#000;color:#fff;z-index:6;display:flex;align-items:center;justify-content:space-between;gap:16px}

.bar-r{display:flex;align-items:center;gap:18px;font-size:13px;letter-spacing:.14em;font-weight:600}
.count{font-variant-numeric:tabular-nums;color:#bbb}

.theme-btn{width:38px;height:38px;border-radius:50%;border:1px solid #444;background:none;color:#ddd;cursor:pointer;display:grid;place-items:center}

/* ---------- burger + menu ---------- */

.burger[aria-expanded="true"] span:nth-child(3){transform:translateY(-8px) rotate(-45deg)}
.menu{position:fixed;top:0;right:0;bottom:0;width:50%;z-index:35;background:rgba(17,22,27,.93);display:grid;grid-template-rows:repeat(5,1fr);transform:translateX(100%);visibility:hidden;transition:transform .55s cubic-bezier(.7,0,.2,1),visibility 0s .55s}

.menu a{display:flex;align-items:center;padding:0 clamp(28px,4vw,64px);color:#fff;text-decoration:none;text-transform:uppercase;letter-spacing:.16em;font-weight:600;font-size:18px;border-bottom:1px solid rgba(255,255,255,.22)}
.menu a:last-child{border-bottom:0}
.menu a span{font-size:12px;color:var(--yel);margin-right:22px;letter-spacing:.1em}

form{display:grid;gap:16px}

textarea{min-height:96px;resize:vertical}
.card .btn{justify-self:start}
.f-note{font-size:14px;color:var(--soft);margin:0;min-height:1.4em}

dialog{border:0;padding:0;background:var(--paper);color:var(--ink);width:min(1040px,94vw);max-height:92vh;overflow:auto}

.m-body{padding:clamp(22px,4vw,44px);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,240px);gap:28px}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 20px;padding:0;list-style:none}

.m-nav{display:flex;gap:8px}
.m-nav button{flex:1;font:600 12px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;padding:13px 8px;background:transparent;color:var(--ink);border:1.5px solid var(--line);cursor:pointer}

@media (prefers-reduced-motion: reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* ---------- mobile ---------- */
@media (max-width:860px){
  .leftbg{display:none}

  .bar{position:relative;width:100%;padding:0 16px}
  .count{display:none}
  .menu{width:100%}
  .m-body{grid-template-columns:1fr}
}

const COLS=[C.navy,C.coral,C.yel,C.blue,C.cream];

/* ---- geometric pattern generator ---- */
function rng(seed){let s=seed%2147483647||7;return()=>(s=s*16807%2147483647)/2147483647;}
function cell(x,y,S,r){
  const pick=()=>COLS[Math.floor(r()*COLS.length)];
  const a=pick(); let b=pick(); while(b===a) b=pick();
  const h=S/2, t=Math.floor(r()*5), o=Math.floor(r()*4);
  let s=`<rect x="${x}" y="${y}" width="${S}" height="${S}" fill="${a}"/>`;
  if(t<=1){ // half circle on an edge
    s+=`<path fill="${b}" d="${[`M${x} ${y}A${h} ${h} 0 0 0 ${x+S} ${y}Z`,`M${x+S} ${y}A${h} ${h} 0 0 0 ${x+S} ${y+S}Z`,`M${x} ${y+S}A${h} ${h} 0 0 1 ${x+S} ${y+S}Z`,`M${x} ${y}A${h} ${h} 0 0 1 ${x} ${y+S}Z`][o]}"/>`;
  }else if(t<=3){ // quarter circle from a corner
    s+=`<path fill="${b}" d="${[`M${x} ${y}L${x+S} ${y}A${S} ${S} 0 0 1 ${x} ${y+S}Z`,`M${x+S} ${y}L${x+S} ${y+S}A${S} ${S} 0 0 1 ${x} ${y}Z`,`M${x+S} ${y+S}L${x} ${y+S}A${S} ${S} 0 0 1 ${x+S} ${y}Z`,`M${x} ${y+S}L${x} ${y}A${S} ${S} 0 0 1 ${x+S} ${y+S}Z`][o]}"/>`;
  }else{ // full circle
    s+=`<circle cx="${x+h}" cy="${y+h}" r="${h}" fill="${b}"/>`;
  }
  return s;
}
function blocks(seed){
  const r=rng(seed*9973+11); let s='';
  for(let j=0;j<5;j++) for(let i=0;i<4;i++) s+=cell(i*100,j*100,100,r);
  return `<svg viewBox="0 0 400 500" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${s}</svg>`;
}
function chevrons(){
  const st=(id,rot)=>`<pattern id="${id}" patternUnits="userSpaceOnUse" width="240" height="240" patternTransform="rotate(${rot})"><rect width="60" height="240" fill="${C.coral}"/><rect x="60" width="60" height="240" fill="${C.navy}"/><rect x="120" width="60" height="240" fill="${C.yel}"/><rect x="180" width="60" height="240" fill="${C.blue}"/></pattern>`;
  return `<svg viewBox="0 0 400 500" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs>${st('cA',45)}${st('cB',-45)}</defs>
  <rect width="200" height="250" fill="url(#cB)"/><rect x="200" width="200" height="250" fill="url(#cA)"/>
  <rect y="250" width="200" height="250" fill="url(#cA)"/><rect x="200" y="250" width="200" height="250" fill="url(#cB)"/></svg>`;
}

/* ---- active chapter tracking ---- */
let active=0;
function setActive(k){
  if(k===active) return; secs[active].classList.remove('on'); secs[k].classList.add('on'); active=k;
  countEl.innerHTML=`<b>${String(k+1).padStart(2,'0')}</b> / ${total}`;
}

function onScroll(){
  const mid=innerHeight/2; let best=0;
  for(let k=0;k<secs.length;k++){const r=secs[k].getBoundingClientRect(); if(r.top<=mid) best=k; else break;}
  setActive(best);
}
addEventListener('scroll',onScroll,{passive:true}); onScroll();

/* ---- fit big headings to the left column ---- */
function fit(){
  const desk=matchMedia('(min-width:861px)').matches;
  secs.forEach(s=>{const h=s.querySelector('h1,h2'); h.style.fontSize='';
    if(!desk) return;
    let fs=parseFloat(getComputedStyle(h).fontSize), guard=0;
    const box=s.querySelector('.txt');
    while((h.scrollWidth>h.clientWidth+1 || box.scrollHeight>box.clientHeight+1) && fs>30 && guard++<40){fs-=3;h.style.fontSize=fs+'px';}
  });
}
document.fonts&&document.fonts.ready.then(fit); addEventListener('resize',fit); fit();
